[package]
name = "voltfill-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bytes = "1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
pdf-inspector = { version = "=1.25.2", default-features = false }
lopdf = { version = "=0.45.0", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
httpdate = "1.0"
log.workspace = true
opentelemetry = { version = "0.33", default-features = false, features = ["logs", "trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["logs", "trace"] }
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "logs", "with-serde"] }
firecrawl-pdfium = { version = "=0.1.0", optional = true }
png = { version = "0.18", optional = true }
hayro = { version = "=0.8.0", default-features = false, features = ["embed-cmaps", "simd"], optional = true }

[features]
default = []
pdfium = ["dep:firecrawl-pdfium", "dep:png"]
hayro = ["dep:hayro", "dep:png"]

[package]
name = "voltfill-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "voltfill"
path = "src/main.rs"

[dependencies]
voltfill-domain = { path = "../domain" }
voltfill-http = { path = "../http" }
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "std"] }
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["deserialize"] }
serde_json.workspace = true
serde.workspace = true
log.workspace = true

[features]
default = []
pdfium = ["voltfill-domain/pdfium", "voltfill-http/pdfium"]
hayro = ["voltfill-domain/hayro", "voltfill-http/hayro"]

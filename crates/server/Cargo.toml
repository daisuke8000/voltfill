[package]
name = "server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
# Kept until `voltfill serve` becomes the only entry point.
name = "voltfill-server"
path = "src/main.rs"

[dependencies]
domain = { path = "../domain" }
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true

[dev-dependencies]
tower = { version = "0.5", default-features = false, features = ["util"] }

[features]
default = []
pdfium = ["domain/pdfium"]
hayro = ["domain/hayro"]

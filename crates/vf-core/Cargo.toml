[package]
name = "vf-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
vf-source.workspace = true
vf-client.workspace = true
vf-render = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
lopdf.workspace = true
log.workspace = true

[features]
default = []
# Page rendering for the image fallback (`images::DocumentRenderer`).
pdfium = ["dep:vf-render", "vf-render/pdfium"]
hayro = ["dep:vf-render", "vf-render/hayro"]

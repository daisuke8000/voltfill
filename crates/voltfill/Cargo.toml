[package]
name = "voltfill"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
domain = { path = "../domain" }
server = { path = "../server" }
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "std"] }
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["deserialize"] }
serde_json.workspace = true
serde.workspace = true
log.workspace = true

[features]
default = []
pdfium = ["domain/pdfium", "server/pdfium"]
hayro = ["domain/hayro", "server/hayro"]

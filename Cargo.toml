[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false

[workspace.dependencies]
# Workspace crates
vf-source = { path = "crates/vf-source" }
vf-render = { path = "crates/vf-render" }
vf-client = { path = "crates/vf-client" }
vf-core = { path = "crates/vf-core" }
vf-server = { path = "crates/vf-server" }

# External crates
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
thiserror = "2.0"
sha2 = "0.11"
log = "0.4"
unicode-normalization = "0.1.26"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "multipart", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
bytes = "1"
httpdate = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
pdf-inspector = { version = "=1.25.2", default-features = false }
lopdf = { version = "=0.47.0", default-features = false }
firecrawl-pdfium = "=0.1.0"
png = "0.18"
hayro = { version = "=0.8.0", default-features = false, features = ["embed-cmaps", "simd"] }
tower = { version = "0.5", default-features = false, features = ["util"] }

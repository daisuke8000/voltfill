name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

concurrency:
  # Pull requests cancel superseded runs; other events get their own group so a newer
  # schedule or manual run never drops a queued main push and its Pages deploy.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_TERM_COLOR: always

jobs:
  rust:
    if: github.event_name != 'schedule'
    name: Rust (${{ matrix.features }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        features: [default, hayro, pdfium]
    env:
      FEATURES: ${{ matrix.features }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        shell: bash
        run: |
          toolchain=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          rustc --version
          cargo --version
      - name: Formatting
        if: matrix.features == 'default'
        run: cargo fmt --all -- --check
      - name: Check workspace
        if: matrix.features == 'default'
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        shell: bash
        run: cargo clippy --workspace --all-targets --features "${FEATURES/default/}" --locked -- -D warnings
      - name: Tests
        if: matrix.features != 'pdfium'
        shell: bash
        run: cargo test --workspace --features "${FEATURES/default/}" --locked
      # PDFium tests need a native library that CI does not download.
      - name: Compile tests with PDFium feature
        if: matrix.features == 'pdfium'
        run: cargo test --workspace --features pdfium --locked --no-run
      - name: Check combined renderers
        if: matrix.features == 'pdfium'
        run: cargo check --workspace --all-targets --features pdfium,hayro --locked
      - name: Clean build output
        if: always()
        run: cargo clean
  workflows:
    name: Workflow syntax and security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned workflow checkers
        shell: bash
        env:
          GOBIN: ${{ runner.temp }}/workflow-bin
          GOMODCACHE: ${{ runner.temp }}/workflow-go-mod
          GOCACHE: ${{ runner.temp }}/workflow-go-build
          CARGO_TARGET_DIR: ${{ runner.temp }}/workflow-rust-target
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          toolchain=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal
          cargo install zizmor --locked --version 1.32.0 --root "$RUNNER_TEMP/workflow-rust"
      - name: Check workflow syntax and shell scripts
        run: '"$RUNNER_TEMP/workflow-bin/actionlint" -color'
      - name: Check workflow security
        run: '"$RUNNER_TEMP/workflow-rust/bin/zizmor" --offline .github/workflows'
      # Every action, including transitive ones, must resolve to the commit in actions.lock.
      - name: Verify the actions lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify --no-interactive
  audit:
    name: Dependency vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain and auditor
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-audit-target
        run: |
          toolchain=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal
          cargo install cargo-audit --version 0.22.2 --locked --root "$RUNNER_TEMP/cargo-audit"
      - name: Audit locked dependencies
        shell: bash
        run: '"$RUNNER_TEMP/cargo-audit/bin/cargo-audit" audit --file Cargo.lock --deny unsound'
  osv:
    name: OSV vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned OSV-Scanner
        env:
          GOBIN: ${{ runner.temp }}/osv-bin
          GOMODCACHE: ${{ runner.temp }}/osv-go-mod
          GOCACHE: ${{ runner.temp }}/osv-go-build
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0
      # Fail on vulnerabilities and unsound advisories, matching cargo-audit --deny unsound.
      # Informational advisories such as unmaintained crates are reported as warnings,
      # never suppressed and never counted as confirmed vulnerabilities.
      - name: Scan locked dependencies
        shell: bash
        run: |
          report="$RUNNER_TEMP/osv.json"
          status=0
          "$RUNNER_TEMP/osv-bin/osv-scanner" scan source --lockfile Cargo.lock --format json --output-file "$report" || status=$?
          # Exit 1 means findings; anything else non-zero is a scanner error.
          if [[ "$status" -ne 0 && "$status" -ne 1 ]]; then
            echo "::error::osv-scanner failed with exit code $status"
            exit "$status"
          fi
          # Workspace members have no source in Cargo.lock. OSV matches by crates.io name,
          # so an advisory for a same-named crates.io crate does not apply to them.
          LOCAL_PACKAGES=$(awk '/^\[\[package\]\]/ { if (name != "" && !remote) print name "@" version; name = ""; remote = 0 }
            /^name = / { name = $3 } /^version = / { version = $3 } /^source = / { remote = 1 }
            END { if (name != "" && !remote) print name "@" version }' Cargo.lock | tr -d '"' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          export LOCAL_PACKAGES
          findings='[.results[]?.packages[]?
            | {name: .package.name, version: .package.version}
              + (.vulnerabilities[]? | {id, summary,
                 info: ([.affected[]?.database_specific.informational // empty] | first)})
            | .local = ((.name + "@" + .version) | IN(env.LOCAL_PACKAGES | fromjson | .[]))
            | .blocking = ((.local | not) and ((.info == null) or (.info == "unsound")))]'
          jq -r "$findings | .[] | \"\(if .local then \"::notice\" elif .blocking then \"::error\" else \"::warning\" end)::\(.id) \(.name) \(.version) (\(if .local then \"workspace crate, not the crates.io package\" else (.info // \"vulnerability\") end)): \(.summary)\"" "$report"
          blocking=$(jq "$findings | map(select(.blocking)) | length" "$report")
          echo "Blocking OSV findings: $blocking"
          test "$blocking" -eq 0
  deny:
    name: Licenses, bans and sources
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain and cargo-deny
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-deny-target
        run: |
          toolchain=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal
          cargo install cargo-deny --version 0.20.2 --locked --root "$RUNNER_TEMP/cargo-deny"
      # Advisories are covered by the cargo-audit and OSV jobs.
      - name: Check licenses, bans and sources
        run: '"$RUNNER_TEMP/cargo-deny/bin/cargo-deny" --locked check bans licenses sources'
  secrets:
    name: Secret scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned scanner
        env:
          GOBIN: ${{ runner.temp }}/security-bin
          GOMODCACHE: ${{ runner.temp }}/security-go-mod
          GOCACHE: ${{ runner.temp }}/security-go-build
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan committed history
        run: '"$RUNNER_TEMP/security-bin/gitleaks" git --redact=100 --no-banner --log-opts="--all" .'
  deploy-pages:
    name: Deploy architecture to GitHub Pages
    needs: [rust, workflows, audit, osv, deny, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write # publish the architecture page to GitHub Pages
      id-token: write # OIDC token required by actions/deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Publish only the checked revision, and skip runs superseded on main.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Compare with the published pages
        id: changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          latest=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          deploy=true
          # The query string bypasses CDN copies older than the live site.
          if url=$(gh api "repos/$REPOSITORY/pages" --jq .html_url) \
            && curl -fsS "${url%/}/architecture.html?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" | cmp -s - docs/architecture.html \
            && curl -fsS "${url%/}/?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" | cmp -s - docs/architecture.html; then
            deploy=false
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
      - name: Prepare architecture pages
        if: steps.changed.outputs.deploy == 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/voltfill-pages"
          cp docs/architecture.html "$RUNNER_TEMP/voltfill-pages/"
          cp docs/architecture.html "$RUNNER_TEMP/voltfill-pages/index.html"
      - name: Configure GitHub Pages
        if: steps.changed.outputs.deploy == 'true'
        uses: actions/configure-pages@v6.0.0
      - name: Upload Pages artifact
        if: steps.changed.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ${{ runner.temp }}/voltfill-pages
      - name: Deploy GitHub Pages
        if: steps.changed.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v5.0.1
        with:
          timeout: 180000

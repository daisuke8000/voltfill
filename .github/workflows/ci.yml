name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

concurrency:
  # Pull requests cancel superseded runs; other events get their own group so a newer
  # schedule or manual run never drops a queued main push and its Pages deploy.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_TERM_COLOR: always

jobs:
  rust:
    if: github.event_name != 'schedule'
    name: Rust (${{ matrix.features }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        features: [default, hayro, pdfium]
    env:
      FEATURES: ${{ matrix.features }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        shell: bash
        run: |
          toolchain=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          rustc --version
          cargo --version
      - name: Formatting
        if: matrix.features == 'default'
        run: cargo fmt --all -- --check
      - name: Clippy
        shell: bash
        run: cargo clippy --workspace --all-targets --features "${FEATURES/default/}" --locked -- -D warnings
      - name: Tests
        if: matrix.features != 'pdfium'
        shell: bash
        run: cargo test --workspace --features "${FEATURES/default/}" --locked
      # PDFium tests need a native library that CI does not download.
      - name: Compile tests with PDFium feature
        if: matrix.features == 'pdfium'
        run: cargo test --workspace --features pdfium --locked --no-run
      - name: Check combined renderers
        if: matrix.features == 'pdfium'
        run: cargo check --workspace --all-targets --features pdfium,hayro --locked
  audit:
    name: Dependency vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
          persist-credentials: false
      # New advisories against unchanged dependencies are caught by main pushes and the daily schedule.
      - name: Detect dependency changes
        id: deps
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet HEAD^1 HEAD -- Cargo.lock Cargo.toml 'crates/*/Cargo.toml' .cargo/audit.toml .github/workflows/ci.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install pinned toolchain and auditor
        if: steps.deps.outputs.changed != 'false'
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-audit-target
        run: |
          toolchain=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal
          cargo install cargo-audit --version 0.22.2 --locked --root "$RUNNER_TEMP/cargo-audit"
      - name: Audit locked dependencies
        if: steps.deps.outputs.changed != 'false'
        shell: bash
        run: '"$RUNNER_TEMP/cargo-audit/bin/cargo-audit" audit --file Cargo.lock --deny unsound'
  secrets:
    name: Secret scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned scanner
        env:
          GOBIN: ${{ runner.temp }}/security-bin
          GOMODCACHE: ${{ runner.temp }}/security-go-mod
          GOCACHE: ${{ runner.temp }}/security-go-build
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan committed history
        run: '"$RUNNER_TEMP/security-bin/gitleaks" git --redact=100 --no-banner --log-opts="--all" .'
  deploy-pages:
    name: Deploy architecture to GitHub Pages
    needs: [rust, audit, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Runs finish out of order, so every deploy publishes the current tip of main
      # rather than the commit that triggered it; the last deploy is always the newest.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Compare with the published pages
        id: changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          deploy=true
          # The query string bypasses CDN copies older than the live site.
          if url=$(gh api "repos/$REPOSITORY/pages" --jq .html_url) \
            && curl -fsS "${url%/}/architecture.html?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" | cmp -s - docs/architecture.html \
            && curl -fsS "${url%/}/architecture.en.html?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" | cmp -s - docs/architecture.en.html \
            && curl -fsS "${url%/}/?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" | cmp -s - docs/architecture.en.html; then
            deploy=false
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
      - name: Prepare architecture pages
        if: steps.changed.outputs.deploy == 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/voltfill-pages"
          cp docs/architecture.html docs/architecture.en.html "$RUNNER_TEMP/voltfill-pages/"
          cp docs/architecture.en.html "$RUNNER_TEMP/voltfill-pages/index.html"
      - name: Configure GitHub Pages
        if: steps.changed.outputs.deploy == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artifact
        if: steps.changed.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/voltfill-pages
      - name: Deploy GitHub Pages
        if: steps.changed.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: 180000

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  rust:
    if: github.event_name != 'schedule'
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        shell: bash
        run: |
          toolchain=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          rustc --version
          cargo --version
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Check Hayro feature
        run: cargo check --workspace --all-targets --features hayro --locked
      - name: Clippy with Hayro feature
        run: cargo clippy --workspace --all-targets --features hayro --locked -- -D warnings
      - name: Hayro tests
        run: cargo test --workspace --features hayro --locked
      - name: Check combined renderers
        run: cargo check --workspace --all-targets --features pdfium,hayro --locked
      - name: Check PDFium feature
        run: cargo check --workspace --all-targets --features pdfium --locked
      - name: Clippy with PDFium feature
        run: cargo clippy --workspace --all-targets --features pdfium --locked -- -D warnings
      - name: Compile tests with PDFium feature
        run: cargo test --workspace --features pdfium --locked --no-run
      - name: Clean build artifacts
        if: always()
        run: cargo clean
  audit:
    name: Dependency vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain and auditor
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-audit-target
        run: |
          toolchain=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal
          cargo install cargo-audit --version 0.22.2 --locked --root "$RUNNER_TEMP/cargo-audit"
      - name: Audit locked dependencies
        shell: bash
        run: '"$RUNNER_TEMP/cargo-audit/bin/cargo-audit" audit --file Cargo.lock --deny unsound'
      - name: Clean auditor build artifacts
        if: always()
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-audit-target
        run: cargo clean
  secrets:
    name: Secret scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned scanner
        env:
          GOBIN: ${{ runner.temp }}/security-bin
          GOMODCACHE: ${{ runner.temp }}/security-go-mod
          GOCACHE: ${{ runner.temp }}/security-go-build
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan committed history
        run: '"$RUNNER_TEMP/security-bin/gitleaks" git --redact=100 --no-banner --log-opts="--all" .'
  deploy-pages:
    name: Deploy architecture to GitHub Pages
    needs: [rust, audit, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare architecture pages
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/voltfill-pages"
          cp docs/architecture.html docs/architecture.en.html "$RUNNER_TEMP/voltfill-pages/"
          cp docs/architecture.en.html "$RUNNER_TEMP/voltfill-pages/index.html"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ${{ runner.temp }}/voltfill-pages
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: 180000
